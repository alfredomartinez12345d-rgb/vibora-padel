<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Resultados, cuadros, ranking y mapa del circuito de pádel profesional.">
<meta name="theme-color" content="#0a0c1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Víbora">
<title>Víbora Pádel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&display=swap" rel="stylesheet">
<style>
/* Mundo único en oscuro: columna de móvil (máx. 520px), tarjetas grandes, color por nivel de torneo y por jugador. */
:root{
  color-scheme:dark;
  --bg:#0a0c1c; --surface:#14172e; --surface2:#1c2040; --ink:#f4f5ff; --muted:#9aa1c7; --line:#2a2f57;
  --blue:#4f7cff; --violet:#9b6bff; --orange:#ff8a3d; --gold:#ffc53d; --cyan:#3dd6f5; --mint:#3ddc97; --red:#ff5d6c;
  --grad:linear-gradient(135deg,#4f7cff,#9b6bff);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(600px 320px at 0% 0%,rgba(155,107,255,.22),transparent 70%),radial-gradient(520px 300px at 100% 0%,rgba(79,124,255,.2),transparent 70%);background-repeat:no-repeat;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.shell{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-style:italic;font-weight:700;font-size:30px;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#fff,#b9c6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7a8,#d9e021 60%,#9aa800);display:inline-block;box-shadow:0 0 14px rgba(217,224,33,.7)}
main{flex:1;padding:6px 16px 28px;display:flex;flex-direction:column;gap:18px}
main>*{animation:rise .4s both}
main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4){animation-delay:.12s}main>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.02;margin:0;text-wrap:balance}
h2{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:0;display:flex;align-items:center;gap:6px}
section{display:flex;flex-direction:column;gap:10px}
.ic{width:16px;height:16px;flex:none;fill:currentColor;vertical-align:-2px}
.gold{color:var(--gold)}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin:0}
.back{font-size:14px;color:var(--cyan);font-weight:600}
.sub{color:var(--muted);font-size:14px;margin:0}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);border-radius:10px;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--grad);color:#fff;box-shadow:0 4px 16px rgba(110,110,255,.45)}
/* Avatares con iniciales y color propio */
.av{--h:220;display:inline-flex;align-items:center;justify-content:center;flex:none;width:38px;height:38px;border-radius:50%;font-family:var(--display);font-weight:700;font-size:16px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 85% 58%),hsl(calc(var(--h) + 45) 80% 40%));border:2px solid rgba(255,255,255,.14)}
.av{position:relative;overflow:hidden}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%;background:var(--surface2)}
.av.lg{width:64px;height:64px;font-size:26px}.av.xl{width:84px;height:84px;font-size:34px}
.av.sm{width:26px;height:26px;font-size:11px;border-width:1px}
.duo{display:flex}.duo .av+.av{margin-left:-12px}
/* Tarjetas de partido */
.mc{--lv:var(--blue);display:block;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--lv);border-radius:16px;padding:10px 12px}
.mc-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.pill{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.next{background:rgba(61,214,245,.15);color:var(--cyan)}
.pill.hot{background:rgba(255,138,61,.18);color:var(--orange)}
.pill.ex{background:rgba(255,93,108,.16);color:var(--red)}
.pill.lv{background:color-mix(in srgb,var(--lv) 20%,transparent);color:var(--lv)}
.row{display:flex;align-items:center;gap:8px;padding:3px 0}
.row .nm{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.row.win .nm{font-weight:700}
.row.lose{color:var(--muted)}
.seed{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
.sets{display:flex;gap:4px;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.sets b{font-weight:600;min-width:20px;text-align:center;color:var(--muted)}
.sets b.sw{font-weight:700;color:var(--ink)}
.sets sup{font-size:11px;font-weight:600;margin-left:1px}
/* Marcador grande */
.hero{border-radius:24px;padding:18px 14px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(79,124,255,.28),rgba(20,23,46,.9) 48%,rgba(155,107,255,.28));display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;position:relative}
.hero .side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.hero .side.lose{opacity:.6}
.hero .side a{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.hero .mid{font-family:var(--display);font-weight:700;font-size:22px;color:var(--muted)}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.score .row{padding:8px 0}.score .row+.row{border-top:1px solid var(--line)}
.score .row .nm{font-size:16px}
.score .sets{gap:6px}
.score .sets b{min-width:42px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:26px}
.score .row.win .sets b{background:linear-gradient(160deg,rgba(79,124,255,.5),rgba(155,107,255,.5));border-color:rgba(155,107,255,.8);color:#fff}
/* Cuenta atrás */
.count{border-radius:24px;padding:18px;border:1px solid color-mix(in srgb,var(--lv) 45%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--lv) 30%,var(--surface)),var(--surface) 70%);display:flex;flex-direction:column;gap:6px}
.count .cd{font-family:var(--display);font-weight:700;font-size:46px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:1px}
.count b{font-family:var(--display);font-size:26px;font-weight:700}
.livecard{display:block;border-radius:18px;padding:14px;border:1px solid color-mix(in srgb,var(--lv) 50%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--lv) 22%,var(--surface)),var(--surface))}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite;margin-right:6px}
.track{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:10px}
.track i{display:block;height:100%;background:var(--lv);border-radius:3px;transform-origin:left;animation:grow .8s both}
/* Títulos por pareja */
.tt{display:flex;flex-direction:column;gap:6px}
.tt .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600}
.tt .hd b{font-family:var(--display);font-size:24px}
.tbar{display:flex;gap:4px;transform-origin:left;animation:grow .8s both}
.tbar span{--lv:var(--blue);border-radius:10px;padding:6px 4px;text-align:center;font-family:var(--display);font-weight:700;font-size:18px;line-height:1;background:color-mix(in srgb,var(--lv) 38%,var(--surface));border:1px solid color-mix(in srgb,var(--lv) 70%,transparent);min-width:44px}
.tbar small{display:block;font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:.6px;color:color-mix(in srgb,var(--lv) 60%,#fff)}
/* Filas genéricas */
.prow{display:flex;align-items:center;gap:10px;padding:10px 0}
.prow+.prow{border-top:1px solid var(--line)}
.prow .tx{flex:1;min-width:0}
.prow .tx b{display:block;font-weight:600;overflow-wrap:anywhere}
.prow .tx span{font-size:13px;color:var(--muted)}
.chip{font-family:var(--display);font-weight:700;font-size:18px;border-radius:999px;padding:3px 12px;white-space:nowrap}
.chip.up{background:rgba(61,220,151,.16);color:var(--mint)}
.chip.down{background:rgba(255,93,108,.16);color:var(--red)}
.chip.fire{background:rgba(255,138,61,.18);color:var(--orange)}
.big{font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.up{color:var(--mint)}.down{color:var(--red)}
/* Ranking */
.rk{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.rk a,.rk .r{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.rk a:first-child{border-top:0}
.rk .n{font-family:var(--display);font-weight:700;font-size:22px;width:30px;text-align:center;color:var(--muted)}
.rk .t1{background:linear-gradient(90deg,rgba(255,197,61,.22),transparent 70%)}.rk .t1 .n,.rk .t1 .big{color:var(--gold)}
.rk .t2{background:linear-gradient(90deg,rgba(155,107,255,.22),transparent 70%)}.rk .t2 .n,.rk .t2 .big{color:#c3a8ff}
.rk .t3{background:linear-gradient(90deg,rgba(61,214,245,.12),transparent 60%)}
.rk .tx{flex:1;min-width:0}.rk .tx b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .tx span{font-size:12px;color:var(--muted)}
.rk .dif{font-size:13px;color:var(--muted);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
/* KPIs, tablas, gráficos */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi b{display:block;font-family:var(--display);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.a b{color:#b9c6ff}.kpi.b b{color:var(--mint)}.kpi.c b{color:var(--gold)}
.form{display:flex;gap:5px}
.form i{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700;color:#0a0c1c}
.form .w{background:var(--mint)}.form .l{background:var(--red)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;text-align:right;padding:6px 4px}
th:first-child,td:first-child{text-align:left}
td{padding:9px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td a{font-weight:600}
.h2hbar{display:flex;gap:4px;height:10px}
.h2hbar i{border-radius:5px;transform-origin:left;animation:grow .8s both}
.h2hbar i:first-child{background:var(--blue)}.h2hbar i:last-child{background:var(--orange);transform-origin:right}
.tally{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.tally .sc{font-family:var(--display);font-weight:700;font-size:44px;line-height:1}
.tally span:last-child{text-align:right}
.tl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.tl .st{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:3px 10px 3px 3px}
.tl small{color:var(--muted)}
.donut{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.lg{display:flex;flex-direction:column;gap:6px;font-size:14px}
.lg div{display:flex;align-items:center;gap:8px}.lg i{width:10px;height:10px;border-radius:50%;flex:none}.lg span{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.tres{display:flex;align-items:center;gap:10px;padding:11px 0}
.tres+.tres{border-top:1px solid var(--line)}
.tres .tx{flex:1;min-width:0}.tres .tx b{font-weight:600}.tres .tx span{display:block;font-size:13px;color:var(--muted)}
.tres .rs{font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap}
.trow{--lv:var(--blue);display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--lv);border-radius:16px;padding:12px}
.trow b{font-weight:600;display:block}
.trow.off{opacity:.55}
/* Cuadro en llaves */
.brwrap{overflow-x:auto;margin:0 -16px;padding:0 16px 10px;-webkit-overflow-scrolling:touch}
.br{--u:74px;display:grid;grid-auto-columns:204px;column-gap:26px;grid-template-rows:30px repeat(var(--n),var(--u));width:max-content}
.bh{grid-row:1;font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.bc{position:relative;display:flex;align-items:center;min-width:0}
.bm{--lv:var(--blue);display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--lv);border-radius:12px;padding:6px 8px;font-size:13px}
.bm.empty{border-left-color:var(--line);border-style:dashed;color:var(--muted);text-align:center;padding:12px 8px;background:transparent}
.bm .row{padding:1px 0;gap:6px}
.bm .row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm .sets{font-size:17px;gap:2px}.bm .sets b{min-width:14px}
.bm .seed{font-size:11px}
.bc.top::after{content:"";position:absolute;right:-14px;top:50%;height:100%;width:13px;border:2px solid var(--line);border-left:0;border-radius:0 8px 8px 0}
.bc.in::before{content:"";position:absolute;left:-13px;top:50%;width:13px;border-top:2px solid var(--line)}
.hbtn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.hbtn .ic{width:20px;height:20px}
.star{font:inherit;font-size:22px;line-height:1;width:44px;height:44px;padding:0;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center}
.star .ic{width:22px;height:22px}
.star.bell{display:flex;align-items:center;justify-content:center}.star.bell .ic{width:22px;height:22px}
.star.bell[aria-pressed="true"]{color:var(--cyan);border-color:var(--cyan);background:rgba(61,214,245,.12)}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);max-width:min(440px,calc(100vw - 32px));background:#1c2040;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:14px;box-shadow:0 14px 40px -10px rgba(0,0,0,.9);opacity:0;pointer-events:none;transition:.25s;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}
.star[aria-pressed="true"]{color:var(--gold);border-color:var(--gold);background:rgba(255,197,61,.12)}
.fv{color:var(--gold);font-size:12px}
.bm.q{padding:4px;display:flex;flex-direction:column;gap:3px;border-left-color:var(--cyan)}
.bm.q button{font:inherit;font-size:13px;display:flex;justify-content:space-between;gap:6px;align-items:center;width:100%;text-align:left;background:var(--surface2);border:1px solid transparent;color:var(--ink);border-radius:8px;padding:5px 7px;cursor:pointer;min-width:0}
.bm.q button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm.q button small{color:var(--muted);flex:none}
.bm.q button[aria-pressed="true"]{background:var(--grad);font-weight:700}
.bm.q button[aria-pressed="true"] small{color:#fff}
.bm.q .tbd{font-size:13px;color:var(--muted);padding:5px 7px}
.noanim>*{animation:none!important}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer;align-self:flex-start}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{border-radius:18px;padding:14px;border:1px solid var(--line);font-weight:600;display:flex;flex-direction:column;gap:4px}
.links a span{font-size:12px;color:var(--muted);font-weight:400}
.links a:first-child{background:linear-gradient(135deg,rgba(255,197,61,.25),var(--surface))}
.links a:last-child{background:linear-gradient(135deg,rgba(61,214,245,.22),var(--surface))}
.wrap{border-radius:22px;padding:16px;border:1px solid rgba(155,107,255,.55);background:linear-gradient(140deg,rgba(79,124,255,.32),rgba(155,107,255,.22) 45%,rgba(255,138,61,.22))}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.wgrid div b{display:block;font-family:var(--display);font-size:28px;line-height:1}
.wgrid div span{font-size:12px;color:var(--muted)}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duel a{border-radius:16px;padding:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
input[type=search]{font:inherit;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.simg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.simg label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.pick{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
select{font:inherit;width:100%;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.vs{font-family:var(--display);font-weight:700;color:var(--muted)}
.prob{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--orange)}
.prob i{background:var(--blue);transform-origin:left;animation:grow .8s both}
.probl{display:flex;justify-content:space-between;font-family:var(--display);font-size:24px;font-weight:700}
svg{display:block;max-width:100%}
nav.bot{position:sticky;bottom:10px;margin:0 12px 10px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(20,23,46,.92);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;padding:6px}
nav.bot a{padding:8px 4px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bot a .ic{width:22px;height:22px}
nav.bot a[aria-current="page"]{color:#fff;background:var(--grad)}

/* ---------- Retoque visual ---------- */
svg.ic{display:inline-block}
::selection{background:rgba(155,107,255,.45)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(rgba(185,198,255,.07) 1px,transparent 1.5px);background-size:22px 22px;-webkit-mask-image:linear-gradient(#000,transparent 55%);mask-image:linear-gradient(#000,transparent 55%)}
header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 40%,rgba(10,12,28,.72));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
h1{letter-spacing:.2px}
.card,.kpi,.rk,.trow,.mc,.duel a,.livecard,.count{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 14px 30px -22px rgba(0,0,0,.95)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 140px),var(--surface)}
.kpi{background:linear-gradient(160deg,rgba(255,255,255,.05),transparent 60%),var(--surface)}
.trow,.mc{background:linear-gradient(90deg,color-mix(in srgb,var(--lv) 10%,transparent),transparent 45%),var(--surface)}
.trow .sub{display:block;margin-top:3px}
a.mc,a.trow,.rk a,.duel a,.links a,a.tres,.livecard{transition:transform .15s ease,border-color .15s ease,background-color .15s ease}
a.mc:active,a.trow:active,.rk a:active,.duel a:active,.links a:active,.livecard:active{transform:scale(.985)}
@media (hover:hover){a.mc:hover,a.trow:hover,.livecard:hover{border-color:color-mix(in srgb,var(--lv) 60%,var(--line))}.rk a:hover,a.tres:hover{background-color:rgba(255,255,255,.03)}}
nav.bot{box-shadow:0 18px 40px -12px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.06)}
nav.bot a[aria-current="page"]{box-shadow:0 6px 20px -4px rgba(110,110,255,.6)}
.brwrap{scrollbar-color:var(--line) transparent}
/* ---------- Mapa del circuito ---------- */
.map{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(120% 100% at 50% 0%,#1a2150,#0d1027 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 40px -24px rgba(0,0,0,.95)}
.map svg{width:100%;height:auto}
.map .grat{fill:none;stroke:rgba(154,161,199,.09);stroke-width:1;vector-effect:non-scaling-stroke}
.map .landbg{fill:rgba(111,123,196,.08)}
.map .land{fill:url(#mdots)}
.map .route{fill:none;stroke:rgba(185,198,255,.35);stroke-width:1.2;stroke-dasharray:2 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.map .route.nx{stroke:var(--cyan);stroke-width:2;stroke-dasharray:6 6;animation:march 1s linear infinite;filter:drop-shadow(0 0 3px rgba(61,214,245,.8))}
@keyframes march{to{stroke-dashoffset:-12}}
.pin{cursor:pointer;outline:none}
.pin .hit{fill:transparent}
.pin .core{fill:var(--lv);stroke:#0a0c1c;stroke-width:1.5;vector-effect:non-scaling-stroke;transition:r .2s}
.pin.pend .core{fill:#0d1027;stroke:var(--lv);stroke-width:2}
.pin .cnt{font-family:var(--display);font-weight:700;fill:#0a0c1c;pointer-events:none}
.pin.pend .cnt{fill:var(--lv)}
.pin .ring{fill:none;stroke:var(--lv);stroke-width:2;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
.pin .halo{fill:color-mix(in srgb,var(--lv) 22%,transparent);stroke:var(--lv);stroke-width:1;vector-effect:non-scaling-stroke}
.pin.sel .core{stroke:#fff;stroke-width:2}
.pin:focus-visible .core{stroke:var(--cyan);stroke-width:3}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.mlabel{font-family:var(--display);font-weight:700;fill:#fff;stroke:#0a0c1c;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.mleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.mleg span{display:inline-flex;align-items:center;gap:6px}
.mleg i{width:10px;height:10px;border-radius:50%;background:var(--lv)}
.mleg i.o{background:transparent;border:2px solid var(--muted)}
.mpanel{border-top:3px solid var(--lv)}
.mph{display:flex;gap:12px;align-items:center;margin-bottom:4px}
.mflag{font-size:34px;line-height:1}
.mpanel .tres .tx span{margin-top:2px}
.mpanel .tres .tx span.dot{display:inline-block;margin-top:0}
.mpanel .tres .tx .pill{display:inline;margin-left:4px;vertical-align:2px}

/* ---------- App instalable y apoyo ---------- */
header.top{padding-top:calc(16px + env(safe-area-inset-top))}
nav.bot{bottom:calc(10px + env(safe-area-inset-bottom))}
.inst{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border-color:rgba(61,214,245,.4);background:linear-gradient(135deg,rgba(61,214,245,.16),var(--surface) 60%)}
.inst img{width:52px;height:52px;border-radius:14px;box-shadow:0 6px 18px -6px rgba(0,0,0,.8)}
.inst b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.inst .sub{font-size:13px}
.inst .row2{grid-column:1/-1;display:flex;gap:8px}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 18px -6px rgba(110,110,255,.7)}
.pala{display:flex;align-items:center;gap:12px;padding:12px 14px;border-color:rgba(217,224,33,.35);background:linear-gradient(120deg,rgba(217,224,33,.12),var(--surface) 55%)}
.palaic{width:42px;height:42px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(217,224,33,.16);color:#e3ea4a}
.palaic{position:relative;overflow:hidden}
.palaic:has(.foto){width:58px;height:78px;background:#f4f5ff}
.palaic .foto{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#f4f5ff;padding:2px}
.palaic svg{width:24px;height:24px;fill:currentColor}
.pala .tx{flex:1;min-width:0}.pala .tx b{display:block;font-weight:700;font-size:16px;overflow-wrap:anywhere;margin-top:2px}.pala .tx span{font-size:11px;color:var(--muted)}


/* ---------- Orden de juego y fotos de torneos ---------- */
.oopseg{display:flex;flex-wrap:nowrap;overflow-x:auto;margin:8px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.oopseg button{white-space:nowrap;flex:none}.oopseg small{opacity:.7;font-weight:500}
.pill.cat{background:rgba(79,124,255,.2);color:#9db4ff}.pill.cat.f{background:rgba(255,126,182,.2);color:#ffb3d4}
.oopw{display:flex;flex-direction:column;gap:6px}
.ytb{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:13px;font-weight:700;color:#fff;background:#d4232b;border-radius:10px;padding:7px 12px;box-shadow:0 6px 16px -8px rgba(212,35,43,.8)}
.ytb .ic{width:18px;height:18px}
.ytb.big{align-self:stretch;justify-content:center;font-size:15px;padding:12px 14px;border-radius:14px}
.ytb:active{transform:scale(.98)}
.oop{--lv:var(--blue);display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--lv);border-radius:16px;padding:10px 12px}
.oop.fav{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));border-left-color:var(--gold);background:linear-gradient(90deg,rgba(255,197,61,.1),transparent 55%),var(--surface)}
.oopt{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:54px;border-right:1px solid var(--line);padding-right:10px}
.oopt b{font-family:var(--display);font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.oopt small{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.oopm{flex:1;min-width:0}
.oopc{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.poster{flex:none;padding:0;border:0;background:var(--surface2);border-radius:12px;overflow:hidden;cursor:zoom-in;aspect-ratio:1131/1600;width:104px;box-shadow:0 12px 26px -12px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.08)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster.sm{width:60px;border-radius:9px}
.thead{display:flex;gap:14px;align-items:flex-end}
.thead>div{min-width:0;flex:1}
#lb{position:fixed;inset:0;z-index:90;background:rgba(5,6,15,.92);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;animation:rise .2s both}
#lb img{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 30px 80px -20px #000}
.count{position:relative;overflow:hidden;isolation:isolate}
.count>*{position:relative;z-index:2}
.count .cbg{position:absolute;top:0;right:0;height:100%;width:auto;max-width:55%;object-fit:cover;object-position:top;z-index:0;opacity:.85;-webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%)}

/* ---------- Fantasy · modo mánager ---------- */
nav.bot a[hidden]{display:none}
.fxform{display:flex;flex-direction:column;gap:10px}
.fxform label{font-weight:600}
.fxform input{font:inherit;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.fxmsg{margin:0;padding:12px 14px;border-radius:14px;background:rgba(255,93,108,.14);color:#ffb3ba;font-size:14px}
.fxmsg.ok{background:rgba(61,220,151,.14);color:#a8f0cc}
.fxreg summary,.fxsave summary{cursor:pointer;list-style:none}.fxsave{border-color:rgba(61,214,245,.35)}.fxreg summary::after{content:" ›";color:var(--muted)}
.fxreg ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:6px}.fxreg li b{color:var(--ink)}
.mxlogo{text-align:center;margin:8px 0}.mxlogo img{width:76px;height:76px;border-radius:20px;box-shadow:0 8px 30px #9b6bff55}
.mxlogo b{display:block;font-family:var(--display);font-style:italic;font-weight:700;font-size:34px;text-transform:uppercase;line-height:1;margin-top:8px}
.mxlogo i{display:block;font-style:normal;font-size:11px;letter-spacing:2px;font-weight:700;color:#d9e021}
.mxop{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.mxop>span:first-child{font-size:26px}.mxop b{display:block}.mxop small{color:var(--muted);font-size:13px}
.mxop[disabled]{opacity:.5;cursor:default}
.mxyel{background:linear-gradient(135deg,#f2f56a,#d9e021)!important;color:#1d1f00!important;border:0!important;box-shadow:0 6px 22px rgba(217,224,33,.35);font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.6px;align-self:stretch;padding:13px}
.mxseg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.mxseg button{flex:1;font:inherit;font-size:13px;font-weight:600;padding:8px 4px;border-radius:9px;border:0;background:none;color:var(--muted);cursor:pointer}
.mxseg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink)}
.mxsino button[aria-pressed="true"][data-v="1"]{background:#1f9d63;color:#fff}.mxsino button[aria-pressed="true"][data-v="0"]{background:var(--red);color:#fff}
.mxlbl{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:700}
.mxcod{font:inherit;font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:12px;text-align:center;text-transform:uppercase;width:100%;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.mxcod:focus{outline:none;border-color:#d9e021;box-shadow:0 0 0 3px rgba(217,224,33,.25)}
.mxprev{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding-top:8px;border-top:1px solid var(--line)}
.mxprev span{color:var(--muted);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700}
.mxl{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;width:100%;font:inherit;color:var(--ink);text-align:left}
.mxl .nm{flex:1;min-width:0}.mxl .nm b{display:block;font-family:var(--display);font-size:20px;text-transform:uppercase;line-height:1.05}
.mxl .nm small{color:var(--muted);font-size:13px}.mxl .pos{font-family:var(--display);font-size:24px;font-weight:700;text-align:right;line-height:1}.mxl .pos small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:600}
.mxhead{display:flex;align-items:center;gap:8px}
.mxhead .tt{flex:1;min-width:0}.mxhead .tt small{display:block;font-size:11px;letter-spacing:1.3px;color:var(--muted);font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mxhead h1{font-size:30px;font-style:italic;text-transform:uppercase}
.mxpill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);cursor:pointer;font-family:inherit;white-space:nowrap}
.mxcaja{font-family:var(--display);font-weight:700;font-size:20px;color:var(--mint);font-variant-numeric:tabular-nums;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:2px 12px;white-space:nowrap}
.mxali{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:13.5px}.mxali span{flex:1;min-width:0}.mxali .btn{flex:none}
.mxpuj{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;width:100%;font:inherit;font-size:13px;color:var(--muted);background:rgba(255,93,108,.08);border:1px solid rgba(255,93,108,.35);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left}
.mxpuj b{font-family:var(--display);font-size:16px}
.mxcaja.neg{color:var(--red);border-color:var(--red)}
.mxtabs{position:sticky;bottom:calc(88px + env(safe-area-inset-bottom));z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(20,23,46,.95);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:4px;margin-top:auto}
.mxtabs button{font:inherit;font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);background:none;border:0;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.mxtabs button i{font-style:normal;font-size:19px;line-height:1;height:20px;display:flex;align-items:center;opacity:.8}
.mxtabs button[aria-current="page"]{color:#fff;background:var(--surface2)}.mxtabs button[aria-current="page"] i{opacity:1}
.mxtabs .ico{width:20px;height:20px}
.mxdot{position:absolute;top:0;right:14%;background:var(--red);color:#fff;font-size:9px;font-weight:800;border-radius:999px;padding:0 5px;line-height:15px}
.mxrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);width:100%;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.mxrow.yo{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.mxrow .n{font-family:var(--display);font-weight:700;font-size:20px;width:20px;text-align:center}
.mxrow .tx{flex:1;min-width:0}.mxrow .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mxrow .tx small{color:var(--muted);font-size:12px}
.mxrow .pt{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.mxav{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:hsl(var(--h),55%,45%)}
.mxcards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mxcards.c3{grid-template-columns:repeat(3,1fr)}
/* Cromos: el jugador recortado sale de la carta, precio grande arriba, banda con el nombre y un reflejo que la recorre */
.cr{position:relative;border-radius:14px;padding:0 0 6px;text-align:center;border:2px solid #c0824f;min-width:0;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;width:100%;
  background:radial-gradient(circle at 50% 30%,rgba(192,130,79,.35),transparent 62%),linear-gradient(170deg,#262a52,#14172e);transition:transform .15s ease}
.cr:active{transform:scale(.97)}
.cr.plata{border-color:#c3c9dc;background:radial-gradient(circle at 50% 30%,rgba(195,201,220,.35),transparent 62%),linear-gradient(170deg,#2c3150,#14172e)}
.cr.oro{border-color:var(--gold);background:radial-gradient(circle at 50% 30%,rgba(255,197,61,.45),transparent 62%),linear-gradient(170deg,#3a3010,#14172e)}
.cr.elite{border:2px solid transparent;background:radial-gradient(circle at 50% 30%,rgba(61,214,245,.35),transparent 62%) padding-box,linear-gradient(170deg,#0f2a24,#0a0c1c) padding-box,linear-gradient(120deg,#3dd6f5,#9b6bff,#ffc53d,#3ddc97,#3dd6f5) border-box;background-size:100% 100%,100% 100%,300% 300%;animation:holo 5s linear infinite}
@keyframes holo{to{background-position:0 0,0 0,300% 0}}
.cr::after{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;z-index:4;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.26) 47%,rgba(255,255,255,.05) 52%,transparent 60%);background-size:320% 100%;animation:crbrillo 5.5s ease-in-out infinite}
@keyframes crbrillo{0%,55%{background-position:120% 0}100%{background-position:-60% 0}}
.cr.elite::before{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;z-index:3;mix-blend-mode:color-dodge;opacity:.22;background:linear-gradient(130deg,#3dd6f5,#9b6bff,#ffc53d,#3ddc97,#3dd6f5);background-size:300% 300%;animation:holo2 6s linear infinite}
@keyframes holo2{to{background-position:300% 0}}
.cr .pr{position:absolute;top:4px;left:4px;z-index:5;font-family:var(--display);font-weight:700;font-size:13px;line-height:1;font-variant-numeric:tabular-nums;background:#05060fd9;border:1px solid #ffffff2e;border-radius:8px;padding:3px 5px}
.cr.oro .pr{color:var(--gold)}.cr.elite .pr{color:#8ff0ff}
.cr .ic{position:absolute;top:3px;right:5px;font-size:12px;z-index:5}
.cr .fc{width:100%;aspect-ratio:1/1;border-radius:12px 12px 0 0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:28px;background:transparent center bottom/contain no-repeat;position:relative;z-index:1}
.cr .n{display:block;position:relative;z-index:2;margin-top:-16px;padding:10px 3px 0;background:linear-gradient(180deg,transparent,rgba(5,6,15,.88) 45%);font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .sd{display:block;position:relative;z-index:2;font-size:8px;letter-spacing:.6px;color:var(--muted);font-weight:700;text-transform:uppercase}
.cr .l3{display:flex;justify-content:center;gap:3px;font-size:9.5px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}.cr .l3 i{font-style:normal;padding:0 3px;border-radius:4px;background:var(--surface2)}
.cr.sel{outline:3px solid var(--cyan);outline-offset:2px}
.cr.cap{box-shadow:0 0 0 2px #ffc53d,0 0 18px #ffc53d88}
.cr .x2{position:absolute;left:50%;top:-10px;transform:translateX(-50%);background:var(--gold);color:#2a1d00;font-size:9px;font-weight:800;border-radius:999px;padding:1px 7px;white-space:nowrap;z-index:2}
.cr .tag{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;border-radius:999px;padding:1px 7px;white-space:nowrap;background:var(--blue);color:#fff}
.cr.vacio{border:2px dashed var(--line);background:transparent;color:var(--muted);min-height:130px;display:grid;place-items:center;font-size:13px}
.mxpista{position:relative;border-radius:16px;padding:18px 14px 14px;background:repeating-linear-gradient(90deg,#1d4fb8 0 26px,#173f95 26px 52px);border:2px solid #9cb7ff55}
.mxpista::before{content:"";position:absolute;inset:10px 8px;border:1.5px solid rgba(255,255,255,.5);border-radius:4px;pointer-events:none}
.mxpista .g{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;max-width:300px;margin:0 auto}
.mxpista .red{grid-column:1/-1;border-top:2px dashed rgba(255,255,255,.75);margin:2px 0}
.mxbench{display:flex;gap:10px;justify-content:center}.mxbench .cr{width:30%;max-width:110px}
.mxreq{display:flex;flex-wrap:wrap;gap:6px}.mxreq span{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(61,220,151,.14);color:#a8f0cc}.mxreq span.mal{background:rgba(255,93,108,.16);color:#ffb3ba}
.mxlock{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px}.mxlock b{color:var(--gold);font-variant-numeric:tabular-nums}
.mxscore{display:flex;align-items:center;justify-content:space-between;border-radius:16px;padding:12px 16px;background:var(--grad);color:#fff;font:inherit;width:100%;border:0;cursor:pointer;text-align:left}
.mxscore .big2{font-family:var(--display);font-weight:800;font-size:44px;line-height:.9}
.mxst{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}.mxst.ok{background:#13513a;color:#bff5dd}.mxst.live{background:#5a1d2a;color:#ffc2ca}
.st8{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}

<script>
/* Animación de entrada: una vez por visita, se salta con un toque y no sale con «reducir movimiento». */
(function(){var el=document.getElementById('intro'),seen=false;
  try{seen=sessionStorage.getItem('vibora-intro')==='1';sessionStorage.setItem('vibora-intro','1')}catch(e){}
  if(seen||matchMedia('(prefers-reduced-motion: reduce)').matches){el.remove();return}
  var done=false,end=function(){if(done)return;done=true;el.classList.add('out');setTimeout(function(){el.remove()},420)};
  el.addEventListener('click',end);
  var start=function(){if(el.classList.contains('play'))return;var g=el.querySelector('.in-g'),b=el.querySelector('.in-ball');
    g.style.setProperty('--dx',(g.offsetWidth/2-b.offsetWidth/2)+'px');el.classList.add('play');setTimeout(end,1900)};
  (document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,350)})]):Promise.resolve()).then(start);
  setTimeout(end,4000)})();
</script>

<script>
const D=/*DATA*/null;
const PUSH_APP=/*PUSH*/"";
const SUPA=/*SUPA*/null; /* {url,key} de Supabase para el fantasy (lo pone build.py); null = sin fantasy */ /* App ID de OneSignal (lo pone build.py); vacío = sin avisos */

/* ---------- Carga de datos reales (Padel API) ---------- */
const P={};for(const id in D.P){const [name,sn,nat,side,c,rank,pts,photo]=D.P[id];P[id]={id:+id,name,sn,nat,side,cat:c?'women':'men',rank,pts,photo:/^https:\/\/[^\s"'<>]+$/.test(photo||'')?photo:null,elo:1500,hist:[1500],ms:[],lastT:null}}
const LV={major:'Major',p1:'P1',p2:'P2',finals:'Finals',fip_platinum:'FIP Platinum',fip_gold:'FIP Gold',fip_silver:'FIP Silver'};
const LC={major:'var(--gold)',p1:'var(--orange)',p2:'var(--cyan)',finals:'var(--violet)',fip_platinum:'var(--mint)',fip_gold:'#ff7eb6',fip_silver:'#9aa1c7'};
const okUrl=u=>/^https:\/\/[^\s"'<>()]+$/.test(u||'')?u:null;
const T=D.T.map(([id,name,level,loc,country,start,end,court,status,hidden,photo])=>({id,name,level,loc,country,start,end,court,status,hidden:!!hidden,photo:okUrl(photo)}));
const TM={};T.forEach(t=>TM[t.id]=t);const tb=id=>TM[id];
const M=D.M.map(a=>({yt:/^[A-Za-z0-9_-]{6,20}$/.test(a[17]||'')?a[17]:null,id:a[0],t:a[1],cat:a[2]?'women':'men',round:a[3],idx:a[4],date:a[5],court:a[6],st:a[7],a:a[8],b:a[9],sa:a[10],sb:a[11],sets:a[12],w:a[13],at:a[14]&&!isNaN(Date.parse(a[14]))?new Date(a[14]):null,approx:a[15]===1,nb:a[15]===2,ord:a[16]}));
const Q=(D.Q||[]).map(a=>({id:a[0],t:a[1],cat:a[2]?'women':'men',round:a[3],date:a[4]||'',st:a[5],a:a[6]||[],b:a[7]||[],sets:a[8]||[],w:a[9],q:true})); /* previas Premier: solo para el fantasy */
const MM={};M.forEach(m=>MM[m.id]=m);
const isFipT=t=>!!t&&String(t.level||'').startsWith('fip');
const prem=m=>!isFipT(TM[m.t]); /* las estadísticas solo cuentan Premier Padel */
const RN={1:'Final',2:'Semifinales',4:'Cuartos',8:'Octavos',16:'Dieciseisavos',32:'Primera ronda'};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fd=s=>s?(+s.slice(8,10))+' '+MES[+s.slice(5,7)-1]:'';
const pl=pr=>pr.map(i=>P[i].sn).join(' / ');
const key=pr=>[...pr].sort((a,b)=>a-b).join('-');
const played=m=>m.st<2&&m.w!=null;
const chrono=(x,y)=>x.date<y.date?-1:x.date>y.date?1:y.round-x.round||x.id-y.id;

/* ---------- Elo propio: 1500 de partida, K=32, media de la pareja ---------- */
const avg=pr=>(P[pr[0]].elo+P[pr[1]].elo)/2;
const PK=new Set();
Q.forEach(m=>[...m.a,...m.b].forEach(i=>{if(P[i])(P[i].qs??=[]).push(m)}));
const chronoQ=(x,y)=>x.date<y.date?-1:x.date>y.date?1:(x.q?0:1)-(y.q?0:1)||y.round-x.round||x.id-y.id;
[...M.filter(m=>m.a.length===2&&m.b.length===2&&prem(m)),...Q.filter(m=>m.a.length===2&&m.b.length===2&&[...m.a,...m.b].every(i=>P[i]))].sort(chronoQ).forEach(m=>{
  if(m.q){if(played(m))m.pre=1/(1+Math.pow(10,(avg(m.b)-avg(m.a))/400));return} /* la previa no mueve el Elo */
  [...m.a,...m.b].forEach(i=>P[i].ms.push(m));PK.add(key(m.a));PK.add(key(m.b));
  if(!played(m))return;
  [...m.a,...m.b].forEach(i=>{const p=P[i];if(p.lastT!==null&&p.lastT!==m.t)p.hist.push(p.elo);p.lastT=m.t});
  m.pre=1/(1+Math.pow(10,(avg(m.b)-avg(m.a))/400));
  const d=32*((m.w===0?1:0)-m.pre);m.a.forEach(i=>P[i].elo+=d);m.b.forEach(i=>P[i].elo-=d)});
Object.values(P).forEach(p=>{if(p.lastT!==null)p.hist.push(p.elo)});

/* ---------- Favoritos y quiniela: se guardan solo en este navegador ---------- */
let favs=new Set(),picks={};
try{favs=new Set(JSON.parse(localStorage.getItem('vibora-favs')||'[]'));picks=JSON.parse(localStorage.getItem('vibora-picks')||'{}')}catch(e){}
const saveLocal=()=>{try{localStorage.setItem('vibora-favs',JSON.stringify([...favs]));localStorage.setItem('vibora-picks',JSON.stringify(picks))}catch(e){}};

/* ---------- Consultas ---------- */
const sideOf=(m,p)=>m.a.includes(p)?0:1;
const rec=xs=>({w:xs.filter(x=>x.won).length,l:xs.filter(x=>!x.won).length});
const pct=r=>r.w+r.l?Math.round(100*r.w/(r.w+r.l))+'%':'—';
function playerMatches(p){return P[p].ms.filter(played).map(m=>{const s=sideOf(m,p),pr=s?m.b:m.a;return{m,s,won:m.w===s,partner:pr.find(i=>i!==p)}})}
function pairMatches(pr){const k=key(pr);return M.filter(m=>played(m)&&(key(m.a)===k||key(m.b)===k)).sort(chrono).map(m=>({m,won:(key(m.a)===k?0:1)===m.w}))}
const titles=xs=>xs.filter(x=>x.m.round===1&&x.won).length;
const nPlayed=p=>p.ms.filter(played).length;
const byElo=c=>Object.values(P).filter(p=>p.cat===c&&nPlayed(p)>=5).sort((a,b)=>b.elo-a.elo);
const eloDelta=p=>{const h=p.hist;return h.length<2?0:Math.round(h[h.length-1]-h[h.length-2])};
const lastPremier=()=>T.filter(t=>t.status==='finished'&&!t.hidden&&!t.level.startsWith('fip')).sort((a,b)=>a.start<b.start?1:-1)[0];
const scoreStr=(m,s)=>m.sets&&m.sets.length?m.sets.map(x=>`${x[s]}-${x[1-s]}${x[2]!=null?'('+x[2]+')':''}`).join(', '):'No presentado';
const winP=m=>m.w===0?m.pre:1-m.pre;
const norm=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const lastPair=id=>{const m=P[id].ms[P[id].ms.length-1];return m?(sideOf(m,id)?m.b:m.a):null};

const GEO={};
function geoOf(t){if(t.id in GEO)return GEO[t.id];const c=ctryOf(t.country),iso=c?c[0]:'';let r=null;
  for(const s of [t.loc,t.name]){if(!s)continue;const h=' '+norm(s).replace(/[^a-z0-9]+/g,' ')+' ';let best=null;
    CITY.forEach(x=>{if(iso&&x[0]!==iso)return;x.slice(3).forEach(n=>{if(h.includes(' '+n+' ')&&(!best||n.length>best.n))best={x,n:n.length}})});
    if(best){r={lat:best.x[1],lon:best.x[2],iso:best.x[0]};break}}
  if(!r&&c)r={lat:c[1],lon:c[2],iso,approx:true};
  return GEO[t.id]=r}
const ckey=t=>{const g=geoOf(t);return g?g.lat.toFixed(1)+'_'+g.lon.toFixed(1):null};

  const nt=nextT();return Object.values(gs).map(g=>{g.ts.sort((a,b)=>a.start<b.start?-1:1);
    const live=g.ts.find(t=>t.status==='live'),nx=nt&&g.ts.includes(nt)?nt:null,done=g.ts.filter(t=>t.status==='finished');
    g.main=live||nx||done[done.length-1]||g.ts[0];g.live=!!live;g.next=!!nx;g.pend=g.ts.every(t=>t.status==='pending');return g})}
const REG=[['mundo','Mundo',()=>true,110],['eur','Europa y Golfo',g=>g.lon>-32&&g.lon<70&&g.lat>8,26],['ame','América',g=>g.lon<-30,34]];
function mapBox(gs,minW){const lo=gs.map(g=>g.lon),la=gs.map(g=>g.lat),P8=7;
  let w=Math.min(...lo)-P8,e=Math.max(...lo)+P8,n=Math.max(...la)+P8,s=Math.min(...la)-P8,W=Math.max(e-w,minW),H=n-s;const A=1.75;
  if(W/H<A)W=H*A;else H=W/A;const cx=(w+e)/2,cy=Math.min(80-H/2,Math.max(-56+H/2,(n+s)/2));
  return [mpx(cx-W/2),my(cy+H/2),W*MK,H*MK]}

  const reg=regs.find(r=>r[0]===mapZ)||regs[0];const gs=all.filter(reg[2]);

  const pool=gs.length?gs:all;if(!pool.some(g=>g.k===mapSel)){const d=pool.find(g=>g.live)||pool.find(g=>g.next)||pool.slice().sort((a,b)=>a.main.start<b.main.start?1:-1)[0];mapSel=d.k}

  const GK={};all.forEach(g=>GK[g.k]=g);const nt=nextT(),cur=TC().filter(t=>t.status!=='pending'&&!!ckey(t)).sort((a,b)=>a.start<b.start?1:-1)[0];
  const arc=(a,b,cls)=>{const x1=mpx(a.lon),y1=my(a.lat),x2=mpx(b.lon),y2=my(b.lat),dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy);if(d<0.01)return '';const bend=Math.min(d*0.22,vw*0.12);const cx=(x1+x2)/2+dy/d*bend*(dx<0?-1:1),cy=(y1+y2)/2-Math.abs(dx/d)*bend;return `<path class="${cls}" d="M${f(x1)} ${f(y1)}Q${f(cx)} ${f(cy)} ${f(x2)} ${f(y2)}"/>`};

    return `<g class="pin${g.pend?' pend':''}${sel?' sel':''}" data-pin="${g.k}" tabindex="0" role="button" aria-label="${g.name}: ${g.ts.length} ${g.ts.length===1?'torneo':'torneos'}" aria-pressed="${sel}" style="--lv:${g.live?'var(--red)':LC[g.main.level]||'var(--blue)'}">

  const sg=GK[mapSel],fs=u*4.2,lw=sg.name.length*fs*0.5,ly=my(sg.lat),up=ly-vy>r*2.6+fs;

  const label=gs.includes(sg)?`<text class="mlabel" x="${f(lx)}" y="${f(up?ly-r*2.6:ly+r*2.6+fs*0.8)}" font-size="${f(fs)}" text-anchor="middle" stroke-width="${f(u*0.9)}">${sg.name}</text>`:'';

  const st=t=>{if(t.hidden)return '<span class="sub">Resultados fuera del plan gratuito</span>';if(t.status==='pending')return `<span class="sub">${t===nt?'Próximo torneo':'Por jugar'}</span>`;if(t.status==='live')return '<span class="sub" style="color:var(--ink)"><span class="dot"></span>En juego</span>';const fm=M.find(m=>m.t===t.id&&inCat(m)&&m.round===1&&m.w!=null);return fm?`<span class="sub" style="color:var(--ink)">${IC.trophy} ${pl(fm.w?fm.b:fm.a)}</span>`:''};
  const panel=`<div class="card mpanel" ${lvs(sg.main)}><div class="mph">${poster(sg.main,'sm')||`<span class="mflag">${flag(sg.iso)||'📍'}</span>`}<div><div class="big">${sg.name}</div><span class="sub">${sg.main.photo&&flag(sg.iso)?flag(sg.iso)+' ':''}${ct?ct[3]+' · ':''}${sg.ts.length} ${sg.ts.length===1?'torneo':'torneos'} esta temporada</span></div></div>

let osReady=null;

    OneSignalDeferred.push(async OS=>{try{await OS.init({appId:PUSH_APP,serviceWorkerPath:'sw.js',serviceWorkerUpdaterPath:'sw.js',serviceWorkerParam:{scope:'./'},promptOptions:{autoPrompt:false},notifyButton:{enable:false}});res(OS)}catch(e){rej(e)}});

function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=msg;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),4200)}
async function togglePush(id){const p=P[id];if(!p)return;
  if(isIOS&&!standalone()){toast('En iPhone, primero instala Víbora: en Safari, Compartir → «Añadir a pantalla de inicio». Después actívalos desde la app.');return}
  if(!('Notification' in window)){toast('Este navegador no permite avisos.');return}
  let OS;try{OS=await loadOS()}catch(e){toast('No se han podido cargar los avisos. Prueba de nuevo en un momento.');return}
  try{if(pushOn.has(id)){await OS.User.removeTag('p'+id);pushOn.delete(id);toast('Ya no recibirás avisos de '+p.sn+'.')}
    else{if(!OS.Notifications.permission)await OS.Notifications.requestPermission();

function fxMsg(t,ok){mx.msg={t,ok};rerender()}
function rerender(){if(route().v==='fantasy'){document.getElementById('app').className='noanim';const y=scrollY;render();scrollTo(0,y)}mxHojaPintar()}
function cargarSB(){return new Promise((res,rej)=>{if(window.supabase)return res();const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';s.onload=res;s.onerror=()=>rej(new Error('sdk'));document.head.appendChild(s)})}
const codigoHash=()=>{const m=/^#fantasy-([A-Za-z0-9]{6})$/.exec(location.hash);return m?m[1].toUpperCase():null};
async function mxInit(){if(mx.sb||mx.cargando||!SUPA)return;mx.cargando=true;
  try{await cargarSB();mx.sb=window.supabase.createClient(SUPA.url,SUPA.key,{auth:{persistSession:true,detectSessionInUrl:true,flowType:'implicit'}});
    const {data}=await mx.sb.auth.getSession();mx.ses=data.session;
    mx.sb.auth.onAuthStateChange((ev,s)=>{mx.ses=s;if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'){mx.perfil=undefined;mx.ligas=null;mx.L=null;mxCargar()}});
    await mxCargar()}catch(e){mx.msg={t:'No se ha podido conectar con el fantasy. Prueba en un rato.'}}
  mx.cargando=false;rerender()}
async function mxCargar(){if(!mx.sb)return;
  const [j,e]=await Promise.all([mx.sb.from('m_jugadores').select('id,genero,lado,rank,valor'),mx.sb.from('m_estado').select('*').eq('id',1).maybeSingle()]);
  mx.J={};(j.data||[]).forEach(r=>mx.J[r.id]={...r,valor:+r.valor});mx.est=e.data||{};
  if(!mx.ses){mx.perfil=null;rerender();return}
  const pf=await mx.sb.from('perfiles').select('*').eq('id',mx.ses.user.id).maybeSingle();mx.perfil=pf.data||null;
  if(mx.perfil){try{const eq=await mx.sb.from('equipos').select('user_id').eq('user_id',mx.ses.user.id).maybeSingle();mx.antiguo=!!(eq&&eq.data)}catch(e){mx.antiguo=false}}
  if(mx.perfil&&PUSH_APP&&mxPushOn())loadOS().then(OS=>OS.login(mx.ses.user.id)).catch(()=>{});
  if(mx.perfil){await mxLigas();const c=codigoHash();
    if(c){mx.vista='unirse';mx.cod=c;mxPrev()}
    else{let ult=null;try{ult=localStorage.getItem('vibora-liga')}catch(e){}if(ult&&mx.ligas.some(l=>l.id===ult))await mxAbrir(ult)}}
  rerender()}
async function mxLigas(){const r=await mx.sb.rpc('m_mis_ligas');mx.ligas=r.data||[]}
async function mxAbrir(id,tab){const r=await mx.sb.rpc('m_liga',{p_liga:id});if(r.error){fxMsg(r.error.message);return}
  mx.L=r.data;mx.liga=id;mx.vista='liga';if(tab)mx.tab=tab;mx.sel=null;
  const a=mx.L.alineacion||{jugadores:[],capitan:null},j=(a.jugadores||[]).filter(x=>mxMio(x));
  const guardada=a.capitan&&j.includes(a.capitan)?[a.capitan,...j.filter(x=>x!==a.capitan)]:j;
  if(!(mx.borr&&mx.borr.liga===id&&mx.borr.sucio&&mx.borr.j.every(x=>mxMio(x))))mx.borr={j:[...guardada],liga:id};
  mx.borr.guardada=[...guardada];mx.borr.liga=id;
  if(mx.tor==null)mx.tor=mx.L.estado&&mx.L.estado.bloqueado&&mx.L.estado.torneo?mx.L.estado.torneo:'total';
  try{localStorage.setItem('vibora-liga',id)}catch(e){}
  if(mx.L.yo&&!mx.L.yo.sobre_visto)mxSobre();rerender();if(mx.L.yo&&mx.L.yo.sobre_visto)setTimeout(()=>mxGuia(false),350)}

async function mxPrev(){mx.prev=null;if((mx.cod||'').length!==6)return rerender();const r=await mx.sb.rpc('m_ver_liga',{p_codigo:mx.cod});mx.prev=(r.data&&r.data[0])||false;rerender()}

/* Jugadores, cromos y puntos */
const mxYo=()=>mx.L&&mx.L.miembros?mx.L.miembros.find(m=>m.id===mx.L.yo.id):null;
const mxMio=id=>{const y=mxYo();return !!y&&y.jugadores.some(p=>p.id===id)};
const mxDueño=id=>mx.L?mx.L.miembros.find(m=>m.jugadores.some(p=>p.id===id)):null;
const mxReg=id=>{const m=mxDueño(id);return m?m.jugadores.find(p=>p.id===id):null};
const mxVal=id=>mx.J[id]?mx.J[id].valor:0;
const mxRank=id=>(P[id]&&P[id].rank)||(mx.J[id]&&mx.J[id].rank)||null;
const mxTier=id=>{const r=mxRank(id);return r&&r<=6?'elite':r&&r<=20?'oro':r&&r<=40?'plata':''};
const TIERN={elite:'Élite',oro:'Oro',plata:'Plata','':'Bronce'};
const mxLado=id=>(mx.J[id]&&mx.J[id].lado)||(P[id]&&(P[id].side==='backhand'?'R':P[id].side==='drive'?'D':null));
const mxGen=id=>(mx.J[id]&&mx.J[id].genero)||(P[id]&&P[id].cat==='women'?'F':'M');
const mxNom=id=>P[id]?(P[id].sn||P[id].name):'Jugador '+id;
const LADO={R:'Revés',D:'Drive'};
const SEAS=()=>T.filter(t=>!isFipT(t)&&!t.hidden&&M.some(m=>m.t===t.id)).sort((a,b)=>a.start<b.start?-1:1);
const SG=1/(1+Math.pow(10,100/400));
function mxPartido(m,s,primero){if(m.w==null||m.st>2)return null;const gana=m.w===s,v=m.q?2:{1:12,2:8,4:5}[m.round]||3,kv=m.q?'vq':'vict',fin=m.round===1&&!m.q;
  const c={vict:0,vq:0,camp:0,sets:0,sin:0,rosco:0,sorp:0,primero:0,cero:0},n={vict:0,vq:0,camp:0,sets:0,sin:0,rosco:0,sorp:0,grande:0,primero:0,cero:0};
  if(m.st===1||m.st===2){if(gana){c[kv]=v;n[kv]=1;if(fin){c.camp=5;n.camp=1}}return{c,n}}
  const st=(m.sets||[]).filter(x=>x.length>=2).map(x=>[x[s],x[1-s]]);
  n.sets=st.filter(([a,b])=>a>b).length;c.sets=n.sets;n.rosco=st.filter(([a,b])=>a===6&&b===0).length;c.rosco=2*n.rosco;n.cero=st.filter(([a,b])=>a===0&&b===6).length;c.cero=-n.cero;
  if(gana){c[kv]=v;n[kv]=1;if(fin){c.camp=5;n.camp=1}if(st.every(([a,b])=>a>b)){c.sin=1;n.sin=1}
    if(m.pre!=null){const mio=s===0?m.pre:1-m.pre;if(mio<.5){n.sorp=1;c.sorp=mio<SG?4:2;if(mio<SG)n.grande=1}}}
  else if(primero){c.primero=-2;n.primero=1}
  return{c,n}}
const mxCache={};
function mxTorneo(pid,tid){const k=pid+':'+tid;if(mxCache[k])return mxCache[k];
  const ms=P[pid]?[...(P[pid].qs||[]).filter(m=>m.t===tid),...P[pid].ms.filter(m=>m.t===tid)].sort(chronoQ):[];let primero=true;const res=[];
  for(const m of ms){const r=mxPartido(m,sideOf(m,pid),primero);if(!r)continue;primero=false;res.push({m,...r,p:Object.values(r.c).reduce((a,b)=>a+b,0)})}
  return mxCache[k]={tot:res.reduce((a,x)=>a+x.p,0),res,jugo:ms.length>0,vivo:ms.some(m=>m.st===3)}}
function mxUlt3(id){return SEAS().filter(t=>t.status!=='pending').slice(-3).map(t=>{const r=mxTorneo(id,t.id);return r.jugo?r.tot:'–'})}
function cromo(id,o={}){const t=mxTier(id),f=P[id]&&P[id].photo,cl=o.cls||'',i=o.icon||'';
  return `<button type="button" class="cr ${t} ${cl}" data-mxj="${id}" ${o.at||''}>${o.x2?'<span class="x2">🏆 PALA DE ORO ×2</span>':''}${o.sinPrecio?'':`<span class="pr">${mxM(mxVal(id))}</span>`}${i?`<span class="ic">${i}</span>`:''}
    <span class="fc" style="--h:${(id*47)%360}${f?`;background-image:url('${f}');color:transparent`:''}">${P[id]?ini(P[id]):'?'}</span><span class="n">${esc(mxNom(id))}</span>
    <span class="sd">${mxGen(id)==='F'?'♀':'♂'} ${LADO[mxLado(id)]||''} · ${TIERN[t]}</span>${o.l3===false?'':`<span class="l3">${mxUlt3(id).map(x=>`<i>${x}</i>`).join('')}</span>`}${o.tag?`<span class="tag">${o.tag}</span>`:''}</button>`}

function falta(ts){let s=Math.max(0,(new Date(ts)-Date.now())/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} h ${m} min`:`${m} min`}
const horaDe=ts=>new Date(ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
/* Las alineaciones se congelan con la actualización del día en que empieza el torneo (01:30 UTC): se enseña en la hora de cada uno */
function mxBloqueo(){const t=T.filter(t=>!isFipT(t)&&t.status==='pending'&&t.start).sort((a,b)=>a.start<b.start?-1:1)[0];if(!t)return null;
  const d=new Date(t.start+'T01:30:00Z');return{t,d,txt:d.toLocaleString('es-ES',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}}
