name: Actualizar datos Víbora Pádel

on:
  schedule:
    - cron: '30 1 * * *'       # completa: toda la temporada, cada noche
    - cron: '15,45 * * * *'    # rápida: cada 30 min, solo si hay un torneo en juego
  workflow_dispatch:
    inputs:
      modo:
        description: 'completa (toda la temporada) o rapida (solo torneos en juego)'
        type: choice
        options: [completa, rapida]
        default: completa

# Una ejecución detrás de otra, nunca dos a la vez
concurrency:
  group: actualizar-vibora
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Elegir modo
        id: modo
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODO="${{ inputs.modo }}"
          elif [[ "${{ github.event.schedule }}" == "30 1 * * *" ]]; then
            MODO=completa
          else
            MODO=rapida
          fi
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"
          echo "Modo: $MODO"

      # Datos de la última ejecución (la rápida parte de ellos; la completa solo conserva el estado de los avisos)
      - name: Recuperar datos guardados
        uses: actions/cache/restore@v4
        with:
          path: datos
          key: datos-${{ github.run_id }}
          restore-keys: datos-

      - name: Actualización rápida (torneos en juego)
        id: rapida
        if: steps.modo.outputs.modo == 'rapida'
        env:
          PADEL_API_TOKEN: ${{ secrets.PADEL_API_TOKEN }}
        run: bash directo.sh

      - name: Descargar toda la temporada
        if: steps.modo.outputs.modo == 'completa'
        env:
          PADEL_API_TOKEN: ${{ secrets.PADEL_API_TOKEN }}
        run: |
          mkdir -p previo && { mv datos/avisos.json datos/pp_previa.json previo/ 2>/dev/null || true; }
          rm -rf datos
          bash descargar.sh
          mv previo/avisos.json previo/pp_previa.json datos/ 2>/dev/null || true

      - name: ¿Hay que publicar?
        id: pub
        run: |
          if [[ "${{ steps.modo.outputs.modo }}" == "completa" || "${{ steps.rapida.outputs.hay_directo }}" == "1" ]]; then
            echo "si=1" >> "$GITHUB_OUTPUT"
          else
            echo "Nada nuevo que publicar."
          fi

      # Previa de los torneos Premier: Padel API solo la da en sus planes de pago, así que se lee de la página
      # pública del torneo en premierpadel.com con un navegador (previa/previa.js). Solo los primeros días del torneo.
      - name: Navegador para la previa
        id: previa
        if: steps.pub.outputs.si == '1'
        run: |
          if python3 -I previa/toca.py datos; then echo "si=1" >> "$GITHUB_OUTPUT"; fi

      - name: Guardar el navegador entre ejecuciones
        if: steps.previa.outputs.si == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.49.1

      - name: Leer la previa de premierpadel.com
        if: steps.previa.outputs.si == '1'
        continue-on-error: true   # si falla, la web se publica igual con lo que ya había
        timeout-minutes: 6
        run: |
          npm install --no-save --no-package-lock --prefix previa playwright@1.49.1 > /dev/null
          previa/node_modules/.bin/playwright install --with-deps chromium > /dev/null
          node previa/previa.js datos

      # Emisiones de YouTube del canal oficial para enlazar cada partido a su pista; sin clave no hace nada
      - name: Buscar emisiones en YouTube
        if: steps.pub.outputs.si == '1'
        continue-on-error: true   # si falla, la web se publica igual
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL: ${{ vars.YT_CHANNEL }}
          YT_CHANNEL_FIP: ${{ vars.YT_CHANNEL_FIP }}
        run: python3 -I youtube.py datos

      # Avisos al móvil (OneSignal); sin las claves no hace nada
      - name: Enviar avisos
        if: steps.pub.outputs.si == '1'
        continue-on-error: true   # si falla, la web se publica igual
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
        run: python3 -I avisos.py datos "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Guardar datos para la próxima ejecución
        if: steps.pub.outputs.si == '1'
        uses: actions/cache/save@v4
        with:
          path: datos
          key: datos-${{ github.run_id }}

      - name: Construir la web
        if: steps.pub.outputs.si == '1'
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_OAUTH: ${{ vars.SUPABASE_OAUTH }}   # «google» cuando esté activado en Supabase
        run: |
          python3 -I build.py datos datos template.html index.html
          echo "Tamaño: $(wc -c < index.html) bytes"
          # Solo se publica la app: los datos en bruto de la API no salen a la web
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png _site/
          [[ -d fotos ]] && cp -r fotos _site/ || true

      # Fantasy (modo mánager): valores, bloqueo de alineaciones, puntos y mercados en Supabase
      - name: Fantasy mánager
        if: steps.pub.outputs.si == '1'
        continue-on-error: true   # si falla, la web se publica igual
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 -I manager.py datos

      # Bot de X (xbot/xbot.py): campeones, sorpresas, partidos del día, Elo y cierre del fantasy.
      # Publica de verdad solo con la variable X_PUBLICAR=1; si no, deja las imágenes como artefacto para revisarlas.
      - name: Recuperar estado del bot de X
        if: steps.pub.outputs.si == '1'
        uses: actions/cache/restore@v4
        with:
          path: xestado
          key: xbot-${{ github.run_id }}
          restore-keys: xbot-

      - name: Bot de X
        if: steps.pub.outputs.si == '1'
        continue-on-error: true   # si falla, la web se publica igual
        env:
          X_PUBLICAR: ${{ vars.X_PUBLICAR }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python3 -m pip install --quiet pillow
          rm -rf xestado/salida
          python3 -I xbot/xbot.py datos xestado

      - name: Guardar estado del bot de X
        if: steps.pub.outputs.si == '1'
        uses: actions/cache/save@v4
        with:
          path: xestado
          key: xbot-${{ github.run_id }}

      - name: Imágenes del bot de X (para revisar)
        if: steps.pub.outputs.si == '1'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: xbot-imagenes
          path: xestado/salida
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar en GitHub Pages
        if: steps.pub.outputs.si == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      # GitHub Pages falla a veces al publicar («no artifacts found», «try again later»): se reintenta dos veces
      - name: Desplegar
        id: desplegar1
        if: steps.pub.outputs.si == '1'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Esperar antes de reintentar
        if: steps.pub.outputs.si == '1' && steps.desplegar1.outcome == 'failure'
        run: sleep 45

      - name: Desplegar (2.º intento)
        id: desplegar2
        if: steps.pub.outputs.si == '1' && steps.desplegar1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Esperar antes del último intento
        if: steps.pub.outputs.si == '1' && steps.desplegar1.outcome == 'failure' && steps.desplegar2.outcome == 'failure'
        run: sleep 90

      - name: Desplegar (3.er intento)
        if: steps.pub.outputs.si == '1' && steps.desplegar1.outcome == 'failure' && steps.desplegar2.outcome == 'failure'
        uses: actions/deploy-pages@v4
