name: Actualizar datos Víbora Pádel

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Descargar datos de Padel API
        env:
          PADEL_API_TOKEN: ${{ secrets.PADEL_API_TOKEN }}
        run: |
          chmod +x descargar.sh
          bash descargar.sh

      - name: Construir index.html
        run: |
          python3 -I build.py datos datos template.html index.html
          echo "Tamaño: $(wc -c < index.html) bytes"

      - name: Publicar en GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar
        uses: actions/deploy-pages@v4
